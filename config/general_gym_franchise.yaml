  # OWNERSHIP INDICATORS (for Owner Pain leads)
  ownership_indicators:
    - phrase: "my gym"
      weight: 10
    - phrase: "our studio"
      weight: 10
    - phrase: "as an owner"
      weight: 10
    - phrase: "I own"
      weight: 10
