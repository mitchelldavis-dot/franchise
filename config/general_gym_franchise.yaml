    - phrase: "sell my franchise"
      penalty: -30
    - phrase: "franchise my business"
      penalty: -30

# Scoring Configuration
scoring:
  weights:
    phrase_hits: 1.0
    proximity_bonus: 0.3
    question_format: 0.2
    first_person: 0.25
    budget_signals: 0.15
    timeline_signals: 0.2
    location_signals: 0.15
    source_weighting: 0.1
    freshness_boost: 0.1
    ownership_indicators: 0.3

  thresholds:
    buyer_researching: 40
    buyer_comparing: 60
    buyer_ready: 80
    owner_mild_pain: 40
    owner_serious_pain: 60
    owner_urgent: 80

  proximity_window: 10  # words

  source_weights:
    reddit: 1.0
    youtube: 0.9
    rss: 0.8
    web_crawl: 0.7
    manual_import: 1.0

  freshness_decay_days: 30

# Rate Limits (requests per minute)
rate_limits:
  reddit: 60
  youtube: 100
  web_crawl: 30
  rss: 60
