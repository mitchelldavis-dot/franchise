  # NEGATIVE / EXCLUSION PHRASES
  negative_phrases:
    - phrase: "NFL franchise"
      penalty: -50
    - phrase: "NBA franchise"
      penalty: -50
    - phrase: "NHL franchise"
      penalty: -50
    - phrase: "MLB franchise"
      penalty: -50
    - phrase: "sports franchise"
