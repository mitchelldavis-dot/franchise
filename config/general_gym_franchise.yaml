      weight: 10
    - phrase: "discovery day"
      weight: 10
    - phrase: "validation calls"
      weight: 10
    - phrase: "talk to franchisees"
      weight: 9
    - phrase: "franchise broker"
      weight: 9
    - phrase: "franchise consultant"
      weight: 9
    - phrase: "SBA loan"
      weight: 9
    - phrase: "franchise financing"
      weight: 9
    - phrase: "liquid capital"
      weight: 8
    - phrase: "net worth requirement"
      weight: 8

  # FRANCHISE BUYER - MEDIUM INTENT
  franchise_buyer_medium:
    - phrase: "looking to buy a business"
      weight: 6
    - phrase: "business ownership"
      weight: 5
    - phrase: "want to be my own boss"
