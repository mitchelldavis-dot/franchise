# General Gym & Fitness Franchise Configuration
# Florida-First Lead Radar

version: "1.0"
name: "general_gym_franchise"
description: "General configuration for gym and fitness franchise lead discovery"

# Geography Settings
geography:
  florida_only_mode: true
  florida_score_boost: 5
  florida_lead_threshold: 50  # Min leads/week to stay Florida-only

  florida_cities:
    - Miami
    - Tampa
    - Orlando
    - Jacksonville
    - St. Petersburg
    - Hialeah
    - Tallahassee
    - Fort Lauderdale
    - Port St. Lucie
    - Cape Coral
    - Pembroke Pines
    - Hollywood
    - Miramar
    - Coral Springs
    - Clearwater
    - West Palm Beach
    - Lakeland
    - Pompano Beach
    - Davie
    - Boca Raton
    - Deltona
    - Plantation
    - Palm Bay
    - Sunrise
    - Largo

  florida_counties:
    - Miami-Dade
    - Broward
    - Palm Beach
    - Hillsborough
    - Orange
    - Pinellas
    - Duval
    - Lee
    - Polk
    - Brevard
    - Volusia
    - Seminole
    - Pasco
    - Sarasota
    - Manatee
    - Leon
    - Collier
    - Escambia
    - Lake
    - St. Lucie

# Sources Configuration
sources:
  enabled:
    - reddit
    - rss
    - web_crawl
    - youtube
    - manual_import

  reddit:
    subreddits:
      - Entrepreneur
      - smallbusiness
      - franchise
      - franchising
      - FitnessEntrepreneur
      - GymOwners
      - PersonalTraining
      - crossfit
      - yoga
      - pilates
      - martialarts
      - Florida
      - Miami
      - Tampa
      - Orlando
      - Jacksonville

  youtube:
    queries:
      - "buy gym franchise"
      - "start fitness franchise"
      - "gym franchise opportunities"
      - "fitness studio franchise"
      - "boutique fitness franchise"
      - "gym marketing problems"
      - "gym owner struggles"
      - "fitness studio challenges"

  rss:
    feeds:
      - url: "https://www.franchisegator.com/feed/"
        name: "Franchise Gator"
      - url: "https://www.entrepreneur.com/franchises/rss"
        name: "Entrepreneur Franchises"

  web_crawl:
    seed_urls: []
    max_pages_per_domain: 500
    respect_robots: true
    crawl_delay: 1.0

# Phrase Packs
phrase_packs:

  # FRANCHISE BUYER - HIGH INTENT
  franchise_buyer_high:
    - phrase: "buy a franchise"
      weight: 10
      languages:
        es: "comprar una franquicia"
        pt: "comprar uma franquia"
    - phrase: "franchise opportunities"
      weight: 9
      languages:
        es: "oportunidades de franquicia"
        pt: "oportunidades de franquia"
    - phrase: "franchise for sale"
      weight: 10
    - phrase: "open a franchise"
      weight: 9
    - phrase: "start a franchise"
      weight: 9
    - phrase: "gym franchise"
      weight: 10
    - phrase: "fitness franchise"
      weight: 10
    - phrase: "studio franchise"
      weight: 9
    - phrase: "boutique fitness franchise"
      weight: 10
    - phrase: "how much does it cost"
      weight: 8
    - phrase: "franchise fee"
      weight: 9
    - phrase: "initial investment"
      weight: 9
    - phrase: "startup costs"
      weight: 8
    - phrase: "FDD"
      weight: 10
    - phrase: "franchise disclosure document"
      weight: 10
    - phrase: "Item 19"
      weight: 10
    - phrase: "earnings claim"
      weight: 9
    - phrase: "royalty"
      weight: 7
    - phrase: "marketing fee"
      weight: 7
    - phrase: "territory"
      weight: 8
    - phrase: "protected territory"
      weight: 9
    - phrase: "multi-unit"
      weight: 9
    - phrase: "area developer"
      weight: 10
