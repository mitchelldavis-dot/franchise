[project]
name = "franchise-radar"
version = "0.1.0"
description = "Franchise Lead Radar - Discover and score potential franchise buyers and struggling gym owners"
authors = [{name = "Franchise Radar Team"}]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.16",
    "httpx>=0.26.0",
    "tenacity>=8.2.3",
    "praw>=7.7.1",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "readability-lxml>=0.8.1",
    "google-api-python-client>=2.116.0",
    "typer[all]>=0.9.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "pandas>=2.2.0",
    "reppy>=0.5.0",
    "dateparser>=1.2.0",
    "fuzzywuzzy[speedup]>=0.18.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
